# servodrive's board S -- the board this viewer was first written for, built
# by pcbview instead of servodrive's own tools/plot_layers.py and export_3d.py:
# a check that nothing it did was lost in making it general. A round board, so
# the readout gives radius and angle about the shaft axis as well.
#
#     python3 -m pcbview build examples/servodrive.toml   ->  demo/servodrive/

title = "servodrive"
subtitle = "sequoia-hope"
out = "../demo/servodrive"
back = { href = "../../index.html", label = "pcbview" }
repo = "https://github.com/sequoia-hope/servodrive"

[[boards]]
id = "s"
name = "Board S"
pcb = "~/pcb/servodrive/hardware/single_board/servodrive_S.kicad_pcb"
sch = "~/pcb/servodrive/hardware/single_board/servodrive_S.kicad_sch"
front_note = "the outward face"
back_note = "the motor-facing face"
note = "The one-board servodrive: a three-phase drive on a Ø65 mm six-layer board that bolts to the back of the motor."

[parts]
role_field = "servodrive_role"
lcsc_csv = "~/pcb/servodrive/hardware/parts/lcsc.csv"

# servodrive's tools/export_3d.py SUBST table, as pcbview config
[models."Connector_USB.3dshapes/USB_C_Receptacle_HRO_TYPE-C-31-M-12.step"]
path = "~/pcb/servodrive/hardware/parts/3dmodels/HRO_TYPE-C-31-M-12.step"
offset = [-4.45, -3.65, 0]
rotate = [-90, 0, 0]

[models."Inductor_SMD.3dshapes/AOTA-B201610SR47MT.STEP"]
path = "~/pcb/servodrive/hardware/parts/3dmodels/AOTA-B201610SR47MT.STEP"
offset = [0, 0, 0]
rotate = [0, 0, 0]

[models."Connector_AMASS.3dshapes/AMASS_XT30PW-M_1x02_P2.50mm_Horizontal.step"]
path = "~/pcb/servodrive/hardware/parts/3dmodels/XT30PW-M.STEP"
offset = [-2.5, 10.0, 0]
rotate = [-90, 0, 0]

[models."test.3dshapes/DFN-8_L3.0-W3.0-P0.65-BL-EP.wrl"]
path = "${KICAD9_3DMODEL_DIR}/Package_DFN_QFN.3dshapes/DFN-8-1EP_3x3mm_P0.65mm_EP1.55x2.4mm.step"
offset = [0, 0, 0]
rotate = [0, 0, -90]
